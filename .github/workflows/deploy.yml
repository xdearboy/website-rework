name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: portfolio-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and build
        run: |
          docker run --rm -v "$PWD":/app -w /app oven/bun:1.3.5-alpine sh -c \
            "bun install --frozen-lockfile && bun run build"

      # runs under real node, not bun: that is the production runtime, and it is where
      # the elysia node adapter behaves differently
      - name: Lint, typecheck and test
        run: |
          docker run --rm -v "$PWD":/app -w /app node:20-alpine sh -c \
            "npx biome ci src plugins && npx tsc --noEmit && npx vitest run"

  converge:
    needs: test
    runs-on: portfolio-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: the changelog is built from feat: commits, and werf
          # derives image tags from git content
          fetch-depth: 0

      - name: Generate changelog
        run: |
          docker run --rm -v "$PWD":/app -w /app oven/bun:1.3.5-alpine sh -c \
            "apk add --no-cache git >/dev/null && git config --global --add safe.directory /app && bun run scripts/generate-changelog.ts"
          count=$(grep -o '"hash"' public/changelog.json | wc -l)
          echo "changelog entries: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::changelog is empty"
            exit 1
          fi

      - name: Install werf
        uses: werf/actions/install@v2

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          mkdir -p $HOME/.kube
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials runner \
            --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context default \
            --cluster=in-cluster --user=runner --namespace=default
          kubectl config use-context default

      # Both secrets stay outside the chart: their values come from GitHub
      # secrets, and templating them would write the values into release state.
      - name: Ensure Postgres credentials secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-credentials \
            --from-literal=username=portfolio \
            --from-literal=password="$POSTGRES_PASSWORD" \
            --from-literal=database=portfolio \
            --from-literal=url="postgresql://portfolio:${POSTGRES_PASSWORD}@postgres.default.svc.cluster.local:5432/portfolio" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure GitHub OAuth secret
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          kubectl create secret generic github-oauth \
            --from-literal=client_id="$GH_OAUTH_CLIENT_ID" \
            --from-literal=client_secret="$GH_OAUTH_CLIENT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Converge
        run: |
          . $(werf ci-env github --as-file)
          werf converge \
            --repo ghcr.io/${{ github.repository }} \
            --release portfolio \
            --namespace default \
            --synchronization kubernetes://default
        env:
          WERF_ENV: production
