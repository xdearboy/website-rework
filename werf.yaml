project: portfolio
configVersion: 1
deploy:
  # keeps everything werf-related in one folder instead of a hidden .helm at root
  helmChartDir: werf/chart
---
image: portfolio
dockerfile: Dockerfile
context: .
# public/changelog.json is generated by CI right before the build, so it is not
# in git. werf ignores untracked files by default (giterminism); this pulls it
# into the build context explicitly.
contextAddFiles:
  - public/changelog.json
