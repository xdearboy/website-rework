apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-domain-ingress
  annotations:
    # cloudflare stores ttl 1 ("auto"); without this external-dns
    # generates ttl 0, always sees a diff and rewrites in a loop
    external-dns.alpha.kubernetes.io/ttl: "1"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/waf: modsecurity
    ingress.kubernetes.io/waf-mode: detect
spec:
  ingressClassName: haproxy
  rules:
    - host: devo.as214422.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
    - host: d3vo.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
  tls:
    - hosts:
        - devo.as214422.lol
      secretName: dev0-tls
    - hosts:
        - d3vo.ru
      secretName: d3vo-ru-tls
