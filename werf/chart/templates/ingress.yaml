apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-domain-ingress
  annotations:
    # cloudflare stores ttl 1 ("auto"); without this external-dns
    # generates ttl 0, always sees a diff and rewrites in a loop
    external-dns.alpha.kubernetes.io/ttl: "1"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/waf: modsecurity
    ingress.kubernetes.io/waf-mode: enforce
    ingress.kubernetes.io/limit-req-rate-limit: "20"
    ingress.kubernetes.io/limit-req-period: "10s"
    ingress.kubernetes.io/limit-req-status-code: "429"
    ingress.kubernetes.io/limit-req-whitelist: "138.124.9.158"
spec:
  ingressClassName: haproxy
  rules:
    - host: devo.as214422.lol
      http:
        paths:
          - path: /.env
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /wp-login.php
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /wp-admin
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /phpmyadmin
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /.git
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /xmlrpc.php
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
    - host: d3vo.ru
      http:
        paths:
          - path: /.env
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /wp-login.php
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /wp-admin
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /phpmyadmin
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /.git
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /xmlrpc.php
            pathType: Prefix
            backend:
              service:
                name: honeypot
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
  tls:
    - hosts:
        - devo.as214422.lol
      secretName: dev0-tls
    - hosts:
        - d3vo.ru
      secretName: d3vo-ru-tls

