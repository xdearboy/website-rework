# The site database as a CloudNativePG cluster: a primary and a streaming
# replica at two different providers (node label topology.kubernetes.io/zone).
# When the primary's node dies the operator promotes the replica, and it can
# rebuild the lost copy on any other allowed node.
#
# 2026-09-26: this used to be one Postgres pod on a Longhorn volume. The node
# holding the volume went down and the guestbook was gone until the data was
# rebuilt by hand from a replica file. The `postgres` Service below follows the
# primary, so postgres-credentials/url and DATABASE_URL stay as they are.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: site-db
spec:
  instances: 2
  # kube/manifests/platform/priority-and-disruption.yaml
  priorityClassName: platform-critical
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  primaryUpdateStrategy: unsupervised
  # a replica on a dead node is not waited for: writes go on with one copy
  minSyncReplicas: 0
  maxSyncReplicas: 0
  storage:
    storageClass: local-path
    size: 2Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              # the edge node stays for the edge; apricot can't pull images
              # reliably; primevault is cordoned
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [ns3250362, apricot-starlite.worldwidehosting.ltd, primevault-vapro.intezio.net]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  bootstrap:
    initdb:
      database: portfolio
      owner: portfolio
      # username and password keys, created by the deploy workflow
      secret: { name: postgres-credentials }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: site-db
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
